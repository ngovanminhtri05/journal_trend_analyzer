name: Build unsigned iOS IPA

# Builds an UNSIGNED .ipa on a macOS runner (no Apple Developer account needed).
# Download the artifact and sign+install it with Sideloadly / AltStore.
# Run manually from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:
  push:
    branches: [feat/lab03-firebase]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-unsigned-ipa.yml'

jobs:
  build-ios:
    # macos-15 ships Xcode 16 (Swift 6) — required by Flutter 3.41's generated Swift.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (release, no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/Runner.app
          zip -qry ../../../JournalTrendAnalyzer-unsigned.ipa Payload
          cd -
          ls -lh JournalTrendAnalyzer-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JournalTrendAnalyzer-unsigned-ipa
          path: JournalTrendAnalyzer-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
